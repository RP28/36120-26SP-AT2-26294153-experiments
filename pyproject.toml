[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "adv_ml_at2"
version = "0.0.1"
description = "ADV ML AT2"
authors = [
  { name = "r" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "loguru",
    "mlweave==0.1.5",
    "pandas==2.2.2",
    "pip",
    "python-dotenv",
    "requests>=2.34.2",
    "ruff",
    "tqdm",
    "typer",
]
requires-python = ">=3.12.11,<3.13"


[tool.ruff]
line-length = 99
src = ["adv_ml_at2"]
include = ["pyproject.toml", "adv_ml_at2/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["adv_ml_at2"]
force-sort-within-sections = true

[tool.uv.sources]
mlweave = { index = "testpypi" }

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true